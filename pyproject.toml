[project]
name = "recursive-directory-pruner"
version = "0.1.0"
description = "Recursively deletes empty directories from the bottom up, with optional depth and path prefix limits."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
